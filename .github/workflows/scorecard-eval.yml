name: Scorecard Evaluation Workflow

# Triggered by Scorecard when you kick off a run against this repo:
#   • repository_dispatch (start-evaluation) — sent by the "Kickoff Run" page's
#     GitHub integration. Config arrives in github.event.client_payload.
#   • workflow_dispatch — manual trigger from the Actions tab. Config arrives in
#     github.event.inputs.
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Project ID
        required: true
      testset_id:
        description: Testset ID
        required: true
      metric_ids:
        description: Metric IDs (comma-separated)
        required: true
      system_version_id:
        description: System Version ID
        required: false
  repository_dispatch:
    types: start-evaluation

permissions:
  contents: read

jobs:
  evaluation-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The Claude Agent SDK drives the `claude` CLI subprocess, so Node + the
      # CLI must be on PATH before the Python agent runs.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}
          # Config resolution: manual workflow_dispatch inputs first, then the
          # repository_dispatch client_payload sent by the Scorecard app.
          PROJECT_ID: ${{ github.event.inputs.project_id || github.event.client_payload.project_id }}
          TESTSET_ID: ${{ github.event.inputs.testset_id || github.event.client_payload.testset_id }}
          METRIC_IDS: ${{ github.event.inputs.metric_ids || github.event.client_payload.metric_ids }}
          SYSTEM_VERSION_ID: ${{ github.event.inputs.system_version_id || github.event.client_payload.system_version_id }}
        run: python3 run_tests.py
